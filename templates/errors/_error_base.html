<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b3f26">
  <link rel="icon" href="/favicon.ico">
  <title>{{ title }} - KasuMarketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0b3f26;
      --primary-dark: #072c1a;
      --accent: #FF6B00;
      --surface: #F5F7FA;
      --tint: #ecf7f0;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E7EB;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: 'Manrope', 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(160deg, var(--surface) 0%, var(--tint) 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ---------- decorative background ---------- */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .blob {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
    }
    .blob-green {
      width: 46vmax; height: 46vmax;
      background: radial-gradient(circle at 30% 30%, #0b3f26, transparent 70%);
      top: -14vmax; left: -12vmax;
      animation: drift-a 26s ease-in-out infinite alternate;
    }
    .blob-orange {
      width: 40vmax; height: 40vmax;
      background: radial-gradient(circle at 60% 60%, #FF6B00, transparent 70%);
      bottom: -16vmax; right: -10vmax;
      opacity: .22;
      animation: drift-b 32s ease-in-out infinite alternate;
    }
    .dots {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(11, 63, 38, .16) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 40%, transparent 85%);
      opacity: .5;
    }

    /* ---------- wordmark ---------- */
    .wordmark {
      position: fixed;
      top: calc(1rem + env(safe-area-inset-top));
      left: calc(1.25rem + env(safe-area-inset-left));
      z-index: 2;
      font-weight: 800;
      font-size: 1.0625rem;
      letter-spacing: -.01em;
      text-decoration: none;
      color: var(--text);
      padding: .5rem .25rem;
    }
    .wm-accent { color: var(--primary); }

    /* ---------- layout ---------- */
    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(4.5rem + env(safe-area-inset-top)) 1.25rem
               calc(2rem + env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 28rem;
      padding: 2.25rem 1.5rem 1.75rem;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: 0 18px 50px rgba(11, 63, 38, .12), 0 2px 8px rgba(17, 24, 39, .05);
      text-align: center;
      animation: card-in .5s cubic-bezier(.16, 1, .3, 1) both;
    }

    /* ---------- visual: big number + illustration ---------- */
    .visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 10.5rem;
      margin-bottom: .75rem;
    }
    .status-num {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -54%);
      font-size: 7.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.05em;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: .17;
      user-select: none;
      white-space: nowrap;
    }
    .illu {
      position: relative;
      z-index: 1;
      width: 8.5rem;
      height: 8.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 4.5s ease-in-out infinite;
    }
    .illu svg { width: 100%; height: 100%; display: block; }

    /* ---------- copy ---------- */
    h1 {
      margin: 0 0 .6rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -.02em;
    }
    .msg {
      margin: 0 auto 1.75rem;
      max-width: 24rem;
      color: var(--muted);
      font-size: .9375rem;
      line-height: 1.6;
    }

    /* ---------- buttons ---------- */
    .btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: .8rem 1.25rem;
      border-radius: .875rem;
      font-family: inherit;
      font-size: .9375rem;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease, color .16s ease;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 20px rgba(11, 63, 38, .25);
    }
    .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-secondary {
      margin-top: .75rem;
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: rgba(11, 63, 38, .06); border-color: var(--primary); transform: translateY(-2px); }
    .btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .login-link {
      display: inline-block;
      margin-top: 1.1rem;
      color: var(--primary);
      font-size: .875rem;
      font-weight: 600;
      text-decoration: none;
      min-height: 48px;
      line-height: 48px;
    }
    .login-link:hover { text-decoration: underline; }
    .login-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: .5rem; }

    .help {
      margin: 1.25rem 0 0;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: .8125rem;
      color: var(--muted);
    }
    .help a { color: var(--muted); text-decoration: underline; }
    .help a:hover { color: var(--primary); }

    /* ---------- motion ---------- */
    @keyframes card-in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(6vmax, 5vmax, 0); }
    }
    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-5vmax, -6vmax, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .blob, .illu, .card { animation: none !important; }
      .btn { transition: none; }
      .btn-primary:hover, .btn-secondary:hover { transform: none; }
    }

    @media (min-width: 480px) {
      .card { padding: 2.75rem 2.25rem 2rem; }
      .status-num { font-size: 8.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob blob-green"></span>
    <span class="blob blob-orange"></span>
    <span class="dots"></span>
  </div>

  <a class="wordmark" href="{{ home_url }}">Kasu<span class="wm-accent">Marketplace</span></a>

  <main class="wrap">
    <section class="card">
      <div class="visual" aria-hidden="true">
        <span class="status-num">{{ status }}</span>
        <div class="illu">{% block illustration %}{% endblock %}</div>
      </div>

      <h1>{{ title }}</h1>
      <p class="msg">{{ message }}</p>

      <a class="btn btn-primary" href="{{ primary_url }}">{{ primary_label }}</a>

      {% if status == 500 %}
      <a class="btn btn-secondary" href="." onclick="location.reload(); return false;">Try again</a>
      {% else %}
      <a class="btn btn-secondary" href="{{ home_url }}" onclick="history.length&gt;1?history.back():location.href='{{ home_url }}'; return false;">Go back</a>
      {% endif %}

      {% block extra_actions %}{% endblock %}

      {% if show_login %}
      <a class="login-link" href="{{ login_url }}">Log in</a>
      {% endif %}

      <p class="help">Need help? <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
    </section>
  </main>
</body>
</html>
