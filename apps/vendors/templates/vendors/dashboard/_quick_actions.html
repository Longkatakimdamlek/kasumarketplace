{# Quick Actions card — included twice in dashboard.html (mobile position + desktop right column) #}
<div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm sm:p-6">
    <h3 class="mb-3 text-sm font-bold text-gray-900 sm:mb-4 sm:text-lg">Quick Actions</h3>
    <div class="space-y-1.5">

        <a href="{% url 'vendors:product_create' %}"
           class="group flex items-center gap-3 rounded-lg p-2.5 transition-colors duration-150 hover:bg-gray-50">
            <span class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary transition-transform duration-150 group-hover:scale-105">
                <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
            </span>
            <div class="min-w-0 flex-1">
                <p class="text-[13px] font-semibold text-gray-900 sm:text-sm">Add Product</p>
                <p class="truncate text-[11px] text-gray-500 sm:text-xs">List a new item in your store</p>
            </div>
            <svg class="size-4 shrink-0 text-gray-400 transition-transform group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
        </a>

    </div>
</div>
