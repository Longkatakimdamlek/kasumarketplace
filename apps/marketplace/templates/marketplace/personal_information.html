{% extends 'marketplace/base.html' %}
{% block title %}Personal Information — KasuMarketplace{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 md:px-6 py-4 md:py-8">

  <!-- Header -->
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'marketplace:profile' %}" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-surface transition-colors">
      <svg class="w-5 h-5 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </a>
    <h1 class="font-display font-bold text-xl text-dark">Personal Information</h1>
  </div>

  <!-- Personal Information Form -->
  <div class="bg-card rounded-2xl shadow-card p-5">
    <form method="POST" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-xs font-semibold text-muted mb-1.5">Full Name</label>
        <input type="text" name="full_name"
               value="{% if profile %}{{ profile.full_name }}{% endif %}"
               placeholder="Your full name"
               class="w-full h-11 px-4 rounded-xl border border-border bg-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-muted mb-1.5">Phone Number</label>
        <input type="tel" name="phone"
               value="{% if profile %}{{ profile.phone }}{% endif %}"
               placeholder="080XXXXXXXX"
               class="w-full h-11 px-4 rounded-xl border border-border bg-surface text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" />
      </div>

      <button type="submit"
              class="w-full py-3 bg-primary text-white font-bold text-sm rounded-xl hover:bg-primary-dark active:scale-95 transition-all">
        Save Changes
      </button>
    </form>
  </div>

</div>
{% endblock %}
