<!-- Category Drawer — slide in from left -->

<!-- Overlay -->
<div id="drawer-overlay"
     onclick="toggleDrawer()"
     class="hidden fixed inset-0 z-40 bg-black/40 backdrop-blur-sm transition">
</div>

<!-- Drawer panel -->
<div id="category-drawer"
     class="drawer drawer-closed fixed top-0 left-0 z-50 h-full w-72 bg-white shadow-2xl flex flex-col">

  <!-- Header -->
  <div class="flex items-center justify-between px-5 h-16 border-b border-border shrink-0">
    <span class="font-display font-bold text-lg text-dark">Categories</span>
    <button onclick="toggleDrawer()" class="p-2 rounded-xl hover:bg-surface transition">
      <svg class="w-5 h-5 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Quick links -->
  <div class="px-5 py-3 border-b border-border grid grid-cols-2 gap-2">
    <a href="{% url 'marketplace:deals' %}" onclick="toggleDrawer()"
       class="flex items-center gap-2 px-3 py-2 rounded-xl bg-accent/10 text-accent text-sm font-semibold">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581a2.25 2.25 0 003.182 0l4.318-4.318a2.25 2.25 0 000-3.182L11.16 3.66A2.25 2.25 0 009.568 3z"/>
      </svg>
      Deals
    </a>
    <a href="{% url 'marketplace:store_directory' %}" onclick="toggleDrawer()"
       class="flex items-center gap-2 px-3 py-2 rounded-xl bg-primary/10 text-primary text-sm font-semibold">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21h18M5 21V7l8-4v18M13 21V11l6 3v7"/>
      </svg>
      Stores
    </a>
    <a href="{% url 'marketplace:new_arrivals' %}" onclick="toggleDrawer()"
       class="flex items-center gap-2 px-3 py-2 rounded-xl bg-purple-50 text-purple-600 text-sm font-semibold">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      New
    </a>
    <a href="{% url 'marketplace:trending' %}" onclick="toggleDrawer()"
       class="flex items-center gap-2 px-3 py-2 rounded-xl bg-emerald-50 text-emerald-600 text-sm font-semibold">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
      </svg>
      Trending
    </a>
  </div>

  <!-- Category list -->
  <div class="flex-1 overflow-y-auto py-3">
    {% for category in categories %}
    <div class="border-b border-border/60 last:border-0">
      <button type="button"
              onclick="toggleSubcategoryPanel('subcat-{{ category.id }}', this)"
              class="w-full flex items-center gap-4 px-5 py-3.5 hover:bg-surface active:bg-primary/5 transition group text-left">

        <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center shrink-0 group-hover:bg-primary/20 transition">
          {% include 'marketplace/partials/category_icon.html' with variant='drawer' %}
        </div>

        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-dark truncate">{{ category.name }}</p>
          <p class="text-xs text-muted">{{ category.subcategories.count }} subcategories</p>
        </div>

        <svg class="subcat-chevron w-4 h-4 text-muted group-hover:text-primary transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <div id="subcat-{{ category.id }}" class="hidden pb-2 pl-[4.75rem] pr-5 space-y-0.5">
        <a href="{% url 'marketplace:category_landing' category.slug %}"
           onclick="toggleDrawer()"
           class="block py-2 text-sm font-medium text-primary hover:underline">
          View all {{ category.name }}
        </a>
        {% for sub in category.subcategories.all %}
        <a href="{% url 'marketplace:category_landing' category.slug %}?subcategory={{ sub.slug }}"
           onclick="toggleDrawer()"
           class="block py-2 text-sm text-dark hover:text-primary transition">
          {{ sub.name }}
        </a>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Footer -->
  <div class="px-5 py-4 border-t border-border shrink-0">
    <a href="{% url 'marketplace:product_list' %}"
       onclick="toggleDrawer()"
       class="block w-full text-center py-3 bg-primary text-white text-sm font-semibold rounded-xl hover:bg-primary-dark transition">
      Browse All Products
    </a>
  </div>
</div>
